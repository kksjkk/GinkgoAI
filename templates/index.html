<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>银杏AI · 液态玻璃</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div id="liquid-glow"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-header"><i class="fas fa-leaf"></i> 银杏AI</div>
    <div id="historyGroupsContainer"></div>
    <div class="user-section">
        <div class="avatar"><i class="fas fa-user"></i></div>
        <span>用户</span>
        <div class="dot-menu" id="dotMenuBtn"><i class="fas fa-ellipsis-v"></i></div>
    </div>
</div>
<div class="main" id="main">
    <div class="top-bar">
        <div class="left-icons">
            <i class="fas fa-leaf" style="color:var(--accent);font-size:1.4rem;"></i>
            <div class="circle-icon" id="menuIconBtn"><i class="fas fa-bars"></i></div>
            <div class="circle-icon" id="newChatIconBtn"><i class="fas fa-plus"></i></div>
            <span class="conversation-title" id="convTitle">银杏AI</span>
        </div>
        <button class="export-btn" id="exportChatBtn"><i class="fas fa-download"></i> 导出对话</button>
    </div>
    <div class="messages-container" id="messagesContainer">
        <div class="welcome-card" id="welcomeCard">
            <div class="welcome-icon"><i class="fas fa-leaf"></i></div>
            <div class="welcome-text">hi，我是银杏，有什么可以帮你的吗？</div>
        </div>
    </div>
    <div class="input-area">
        <div id="imagePreviewArea" class="image-preview-area hidden">
            <img id="previewThumb" class="image-thumb" src="" alt="预览">
            <span id="previewRemove" class="image-remove"><i class="fas fa-times"></i></span>
        </div>
        <div class="toolbar-buttons">
            <button class="tool-btn" id="deepThinkTool"><i class="fas fa-brain"></i> 深度思考</button>
            <button class="tool-btn" id="createMenuBtn"><i class="fas fa-wand-magic-sparkles"></i> AI创作</button>
        </div>
        <div class="input-row">
            <textarea id="messageInput" rows="1" placeholder="输入消息... (支持 /help /clear /save)"></textarea>
            <button class="upload-btn" id="uploadBtn" title="上传图片或代码文件"><i class="fas fa-paperclip"></i></button>
            <button class="send-btn" id="sendBtn"><i class="fas fa-paper-plane"></i></button>
            <button class="stop-btn hidden" id="stopBtn"><i class="fas fa-stop"></i></button>
        </div>
    </div>
</div>

<div id="createMenuModal" class="settings-modal" style="display:none;">
    <div class="settings-container" style="max-width:380px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
            <span style="font-size:1.2rem;color:var(--accent);"><i class="fas fa-wand-magic-sparkles"></i> AI创作</span>
            <span id="createMenuClose" style="cursor:pointer;padding:4px 8px;"><i class="fas fa-times"></i></span>
        </div>
        <div id="menuLevel1" style="display:flex;flex-direction:column;gap:12px;">
            <button class="menu-level-btn" data-target="image" style="padding:14px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-primary);font-size:1rem;cursor:pointer;transition:0.2s;text-align:left;display:flex;align-items:center;gap:12px;">
                <i class="fas fa-image" style="font-size:1.4rem;color:var(--accent);"></i>
                <div><strong>AI生图</strong><span style="display:block;font-size:0.8rem;color:var(--text-secondary);">文生图 / 图生图</span></div>
            </button>
            <button class="menu-level-btn" data-target="video" style="padding:14px;border-radius:16px;border:1px solid var(--glass-border);background:var(--glass-bg);color:var(--text-primary);font-size:1rem;cursor:pointer;transition:0.2s;text-align:left;display:flex;align-items:center;gap:12px;">
                <i class="fas fa-video" style="font-size:1.4rem;color:var(--accent);"></i>
                <div><strong>AI视频</strong><span style="display:block;font-size:0.8rem;color:var(--text-secondary);">文生视频 / 图生视频</span></div>
            </button>
        </div>
        <div id="menuLevel2" style="display:none;flex-direction:column;gap:10px;">
            <div id="menuLevel2Title" style="font-size:0.9rem;color:var(--text-secondary);margin-bottom:4px;cursor:pointer;">← 返回</div>
            <div id="menuLevel2Options" style="display:flex;flex-direction:column;gap:10px;"></div>
        </div>
    </div>
</div>

<div id="popupMenu" class="popup-menu" style="display:none;position:fixed;z-index:2000;min-width:150px;">
    <div class="popup-menu-item" id="downloadApp">📱 下载手机应用</div>
    <div class="popup-menu-item" id="settingsItem">⚙️ 设置</div>
    <div class="popup-menu-item" id="contactOfficial">📧 联系官方</div>
</div>

<div id="settingsModal" class="settings-modal">
    <div class="settings-container">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
            <span style="font-size:1.2rem;color:var(--accent);"><i class="fas fa-cog"></i> 设置</span>
            <span id="settingsClose" style="cursor:pointer;padding:4px 8px;"><i class="fas fa-times"></i></span>
        </div>
        <div class="setting-group">
            <span class="setting-label">🎨 外观主题</span>
            <div style="display:flex;gap:8px;margin-top:6px;">
                <div class="setting-option active" data-theme="dark">深色</div>
                <div class="setting-option" data-theme="light">浅色</div>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label">🎨 主题色</span>
            <div style="display:flex;gap:12px;align-items:center;margin-top:6px;">
                <input type="color" id="themeColorPicker" value="#7cf5b0" style="width:40px;height:40px;border-radius:50%;border:2px solid var(--glass-border);cursor:pointer;background:transparent;padding:0;">
                <span style="color:var(--text-secondary);font-size:0.85rem;">选择你喜欢的颜色</span>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label">🔤 字体大小</span>
            <div style="display:flex;gap:8px;margin-top:6px;">
                <div class="font-option" data-fontsize="small">小</div>
                <div class="font-option active" data-fontsize="medium">中</div>
                <div class="font-option" data-fontsize="large">大</div>
            </div>
        </div>
        <div class="setting-group">
            <span class="setting-label">💬 消息显示</span>
            <div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">
                <span>显示思考过程</span>
                <div class="toggle-switch active" id="toggleThink"></div>
            </div>
        </div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;">
            <button class="danger-btn" id="clearAllData" style="flex:1;">清空历史</button>
            <button class="about-btn" id="aboutBtn" style="flex:1;">📖 关于</button>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
